<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <h2>Expense Tracker</h2>

        <div>
            <a href="#">Dashboard</a>
            <a href="#">Transactions</a>
            <a href="#">Budget & Reports</a>
        </div>
    </nav>


    <!-- Main Dashboard -->
    <main>

        <h1>Dashboard</h1>

        <p>Manage your income and expenses easily.</p>


        <!-- Summary Cards -->
        <section class="summary-container">

            <div class="summary-card">
                <h3>Total Income</h3>
                <p id="totalIncome">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="totalExpense">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Current Balance</h3>
                <p id="balance">₹0</p>
            </div>

        </section>


        <!-- Quick Add Transaction -->
        <section class="transaction-form">

            <h2>Quick Add Transaction</h2>

            <form id="transactionForm">

                <!-- Transaction Type -->
                <label for="type">Transaction Type</label>

                <select id="type">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>


                <!-- Amount -->
                <label for="amount">Amount</label>

                <input 
                    type="number" 
                    id="amount"
                    placeholder="Enter amount"
                >

                <p id="amountError" class="error"></p>


                <!-- Category -->
                <label for="category">Category</label>

                <select id="category">

                    <option value="">Select Category</option>

                    <option value="Food">Food</option>

                    <option value="Travel">Travel</option>

                    <option value="Shopping">Shopping</option>

                    <option value="Bills">Bills</option>

                    <option value="Education">Education</option>

                    <option value="Other">Other</option>

                </select>

                <p id="categoryError" class="error"></p>


                <!-- Date -->
                <label for="date">Date</label>

                <input 
                    type="date" 
                    id="date"
                >

                <p id="dateError" class="error"></p>


                <!-- Description -->
                <label for="description">Description</label>

                <input 
                    type="text"
                    id="description"
                    placeholder="Example: Pizza"
                >

                <p id="descriptionError" class="error"></p>


                <!-- Submit -->
                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </section>


        <!-- Recent Transactions -->
        <button id="removeLastBtn">Remove Last Transaction</button>
        <section class="recent-section">

            <div class="recent-header">

                <h2>Recent Transactions</h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search transactions..."
                >

            </div>


            <!-- JavaScript will add transactions here -->
            <div id="transactionList">

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
